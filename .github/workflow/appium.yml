name: Appium Mobile Tests

on:
  push:
  workflow_dispatch:

jobs:
  appium-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm

      - name: Run Appium tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          script: |
            adb devices
            adb install apk/Hcj_Student_Jobseeker.apk
            npx appium &
            sleep 10
            node test.js