name: Appium Mobile Tests

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

jobs:
  appium-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Appium tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            echo "Android devices:"
            adb devices

            echo "Android boot status:"
            adb shell getprop sys.boot_completed

            echo "Installing HCJ APK..."
            adb install apk/Hcj_Student_Jobseeker.apk.apk

            echo "Starting Appium..."
            npx appium > appium.log 2>&1 &

            sleep 10

            echo "Running Appium tests..."
            npm test